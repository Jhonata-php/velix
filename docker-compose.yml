name: velix

services:
  postgres:
    image: postgres:16-alpine
    container_name: velix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: velix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: velix

    volumes:
      - velix_postgres_data:/var/lib/postgresql/data

    networks:
      - velix_internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velix -d velix"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}

    container_name: velix-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3001
      VELIX_HOST_DIR: /host/velix

      DATABASE_URL: postgresql://velix:${POSTGRES_PASSWORD}@postgres:5432/velix?schema=public

      JWT_SECRET: ${JWT_SECRET}
      VELIX_CREDENTIAL_SECRET: ${VELIX_CREDENTIAL_SECRET}

      WEB_ORIGIN: ${WEB_ORIGIN}

      VELIX_ADMIN_EMAIL: ${VELIX_ADMIN_EMAIL}
      VELIX_ADMIN_PASSWORD: ${VELIX_ADMIN_PASSWORD}

      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}

    # O fluxo de start (esperar banco, migrar, semear, subir a API) mora na
    # imagem (ver apps/api/docker-entrypoint.sh) — não numa string de shell
    # aqui, que é frágil de editar e não é versionada junto do código que roda.

    # Só o diretório de instalação — nada de /var/run/docker.sock. A API escreve
    # ali o pedido de atualização; quem executa é o host (ver velix-updater.path
    # no install.sh). Assim a aplicação web nunca ganha controle do Docker, que
    # seria root no servidor.
    volumes:
      - ${VELIX_INSTALL_DIR:-/opt/velix}:/host/velix

    # Sem isto o container não teria como falar com o SSH da própria máquina —
    # é o que permite gerenciar o servidor onde o Velix roda como qualquer
    # outro servidor (ver LocalServerService).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    expose:
      - "3001"

    networks:
      - velix_internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: velix-web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:3001/api
      NEXT_PUBLIC_APP_URL: ${WEB_ORIGIN}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    expose:
      - "3000"

    networks:
      - velix_internal
      - velix_proxy

    # A publicação da porta ou as configurações do Traefik
    # serão adicionadas automaticamente pelo install.sh através
    # do docker-compose.override.yml.

volumes:
  velix_postgres_data:
    name: velix_postgres_data

networks:
  velix_internal:
    name: velix_internal
    driver: bridge

  velix_proxy:
    name: velix_proxy
    driver: bridge