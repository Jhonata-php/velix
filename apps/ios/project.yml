name: Velix
options:
  bundleIdPrefix: com.velix
  deploymentTarget:
    iOS: "17.0"
targets:
  Velix:
    type: application
    platform: iOS
    sources: [Velix]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velix.app
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Velix/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
    dependencies:
      - package: FirebaseMessaging
  VelixTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VelixTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velix.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Velix
packages:
  FirebaseMessaging:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
