name: Velix
options:
  bundleIdPrefix: com.velix
  deploymentTarget:
    iOS: "17.0"
targets:
  Velix:
    type: application
    platform: iOS
    sources: [Velix]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velix.app
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        DEVELOPMENT_TEAM: 6L7Y2947XZ
        INFOPLIST_KEY_CFBundleDisplayName: Velix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: Velix/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        NSCameraUsageDescription: "Usada só para escanear o QR code de pareamento de uma instância Velix."
    dependencies:
      - package: FirebaseMessaging
  VelixTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VelixTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velix.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Velix
packages:
  FirebaseMessaging:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
